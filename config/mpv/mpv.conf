# mpv + Hyprland 0.57 + NVIDIA на цьому SDR-моніторі.
#
# За замовчуванням mpv ставить target-colorspace-hint=auto і просить
# у композитора wide-color-gamut/HDR-поверхню. Hyprland вмикає WCG,
# хоч дисплей працює в 8-бітному XRGB8888, і показує попередження
# "wide color gamut is enabled but the display is not in 10-bit mode".
# Це також викликає помітне перемикання режиму (блимання) і тональне
# перетворення, через яке SDR-відео виглядає темним.
#
# На цьому дисплеї HDR однаково немає сенсу, тому вимикаємо підказку
# композитору. Якщо колись з'явиться справжній HDR-монітор — прибрати.
target-colorspace-hint=no
