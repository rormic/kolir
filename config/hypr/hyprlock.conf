source = $HOME/.config/hypr/hyprlock-colors.conf

# hyprlock: Wayland session lock screen.
#
# hypridle's lock_cmd starts hyprlock (guarded by pidof, so only one
# instance runs) when logind receives `loginctl lock-session` — its Lock
# signal. The same trigger is used by the SUPER+ALT+L and lid-close binds
# and by hypridle's idle listener; see config/hypr/hypridle.conf for the
# idle timings.
#
# The palette is generated in dark mode from the wallpaper, independently of
# the desktop theme. generate-colors.sh also renders
# ~/.cache/kolir/lock-background.png: a pre-blurred, vignetted version of the
# current wallpaper, so the lock starts fast and the edges stay darker.

$font = Google Sans
$clockFont = Google Sans Flex

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 900
    # compositor_fade = true
    # ^ needs a hyprlock release newer than 0.9.7 (merged upstream after the
    #   0.9.7 release, not yet packaged). Uncomment after upgrading; until
    #   then the fadeIn/fadeOut animations below handle the fade.
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
}

animations {
    enabled = true
    # easeInOutCubic; short 200–300 ms fades for the surface and field states.
    bezier = cubic, 0.65, 0.05, 0.36, 1
    animation = fadeIn, 1, 3, cubic
    animation = fadeOut, 1, 2, cubic
    animation = inputFieldColors, 1, 2, cubic
    animation = inputFieldDots, 1, 2, cubic
}

# pre-blurred and vignetted by generate-colors.sh; no second blur pass here
background {
    monitor =
    path = $HOME/.cache/kolir/lock-background.png
    color = $surface
    blur_passes = 0
    blur_size = 0
    noise = 0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0
    vibrancy_darkness = 0
}

# subtle Matugen surface-variant tint over the vignetted wallpaper
shape {
    monitor =
    size = 100%, 100%
    color = $scrim
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# soft dark radial gradient behind the clock/date/field area
image {
    monitor =
    path = $HOME/.cache/kolir/lock-glow.png
    size = 1200
    rounding = 0
    border_size = 0
    position = 0, 64
    halign = center
    valign = center
    zindex = 0
}

# mixed-style hero clock: one clean line whose glyphs mix Google Sans Flex
# widths, weights, slants and palette colours (markup from
# scripts/lock-clock-text.sh).
label {
    monitor =
    text = cmd[update:60000] $HOME/.config/hypr/scripts/lock-clock-text.sh
    font_size = 210
    font_family = $clockFont
    color = $onSurface
    shadow_size = 10
    shadow_passes = 3
    shadow_color = $shadow

    position = 0, 120
    halign = center
    valign = center
    zindex = 1
}

# date: quiet tracked uppercase caption below the clock (the command emits
# pango markup because a dynamic cmd[] must stay at the start of the text)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B" | tr '[:lower:]' '[:upper:]' | sed 's@^.*$@<span letter_spacing="2560">&</span>@'
    font_size = 16
    font_family = $font
    color = $dateText

    position = 0, -80
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 210, 30
    rounding = 15
    outline_thickness = 1
    inner_color = $fieldFill
    outer_color = $fieldBorder
    check_color = $primary
    fail_color = $error
    capslock_color = $error
    numlock_color = $primary
    bothlock_color = $error
    font_color = $fieldText
    font_family = $font
    fade_on_empty = false
    dots_size = 0.2
    dots_center = true
    dots_spacing = 0.3
    dots_rounding = -2
    # hyprlock scales the field text to height/4 (~7 px here); keep the
    # placeholder/fail line readable with an explicit pango size.
    placeholder_text = <span size="8000">Password</span>
    fail_text = <span size="8000">$PAMFAIL</span>

    position = 0, -140
    halign = center
    valign = center
    zindex = 1
}

# current keyboard layout (hyprlock refreshes $LAYOUT on layout switches)
label {
    monitor =
    text = <span letter_spacing="2048">layout · $LAYOUT[EN,UA]</span>
    font_size = 12
    font_family = $font
    color = $dateText

    position = 0, -185
    halign = center
    valign = center
    zindex = 1
}

# caps lock warning; empty while the LED is off
label {
    monitor =
    text = cmd[update:1000] grep -q '^1$' /sys/class/leds/*::capslock/brightness 2>/dev/null && printf '<span letter_spacing="2048">CAPS LOCK</span>'
    font_size = 12
    font_family = $font
    color = $error

    position = 0, -215
    halign = center
    valign = center
    zindex = 1
}
