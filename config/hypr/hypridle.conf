# hypridle: idle daemon for the Hyprland session.
#
# Runs from the packaged systemd user unit (hypridle.service, enabled by
# `kolir setup`). All locking goes through `loginctl lock-session`, which logind
# forwards to the session's lock command (hyprlock); the manual lock bind and
# the lid-close bind in hyprland.lua use the same entry point, and logind
# keeps its default suspend-on-lid-close behavior.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    # Keep the default ignore_wayland_inhibit = false: the bar's "Keep awake"
    # toggle relies on a Wayland idle inhibitor pausing every listener.
}

# lock the session after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# turn the displays off after 10 minutes, back on on activity
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# suspend the machine after 30 minutes
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
