# hyprsunset configuration.
#
# The Quickshell bar owns runtime control and the automatic schedule
# (right-click the brightness chip). Keep native profiles commented out while
# the bar schedule is enabled, otherwise the two planners will fight over the
# colour temperature.

max-gamma = 100

# Optional native hyprsunset profiles. Uncomment only if you want hyprsunset
# itself to schedule the filter instead of the bar.
#
# profile {
#     time = 21:00
#     temperature = 3500
#     gamma = 1.0
# }
# profile {
#     time = 07:00
#     identity = true
# }
