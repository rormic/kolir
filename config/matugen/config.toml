[config]

[templates.foot]
input_path = '~/.config/matugen/templates/foot-colors.ini'
output_path = '~/.config/foot/colors.ini'

[templates.foot-live]
input_path = '~/.config/matugen/templates/terminal-sequences'
output_path = '~/.cache/terminal-sequences'
post_hook = 'tee /dev/pts/[0-9]* < ~/.cache/terminal-sequences > /dev/null 2>&1'

[templates.nvim]
input_path = '~/.config/matugen/templates/nvim-colors.lua'
output_path = '~/.local/share/nvim/matugen-colors.lua'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook = 'hyprctl reload'

[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell-colors.json'
output_path = '~/.config/quickshell/colors.json'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk3-colors-template.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk4-colors-template.css'
output_path = '~/.config/gtk-4.0/colors.css'

# Obsidian is intentionally not configured here: it needs a per-user vault
# path. `kolir setup` asks for the vault and appends an entry like the one
# below only when the user opts in (the template is still shipped):
#
# [templates.obsidian]
# input_path = '~/.config/matugen/templates/obsidian.css'
# output_path = '<vault>/.obsidian/snippets/matugen.css'
